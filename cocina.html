<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocina — Órdenes en Tiempo Real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    :root{
      --navy:#1B3A6B;--navy-dark:#112549;--navy-mid:#234A88;
      --gold:#C9A84C;--gold-lt:#E8C96A;
      --text:#1A1A2E;--muted:#5A6478;
      --bg:#F0F4FA;--card:#FFFFFF;--border:#D8E4F4;--input-bg:#F7FAFF;
      --danger:#DC2626;--danger-lt:#FEF2F2;
      --success:#16A34A;--success-lt:#F0FDF4;
      --amber:#D97706;--amber-lt:#FFFBEB;
      --radius:14px;--shadow:0 2px 16px rgba(27,58,107,.08);
      /* Urgency colors */
      --ok:#22C55E;      /* < 15 min */
      --warn:#F59E0B;    /* 15–30 min */
      --urgent:#EF4444;  /* > 30 min */
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Karla',system-ui,sans-serif;background:#0F172A;color:#E2EAF5;min-height:100vh;-webkit-font-smoothing:antialiased;}
    button,input{font-family:inherit;cursor:pointer;}

    /* ══ LOGIN ══ */
    #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0A1628,#1B3A6B);padding:24px;}
    .login-card{background:#1C2A3F;border:1px solid #2A3F5C;border-radius:20px;padding:44px 36px;width:100%;max-width:380px;box-shadow:0 24px 80px rgba(0,0,0,.4);}
    .login-icon{width:64px;height:64px;border-radius:16px;background:var(--gold);color:#112549;display:flex;align-items:center;justify-content:center;font-size:1.7rem;margin:0 auto 20px;}
    .login-title{font-family:'Playfair Display SC',serif;font-size:1.5rem;text-align:center;margin-bottom:4px;color:#fff;}
    .login-sub{text-align:center;color:#7A93B5;font-size:.87rem;margin-bottom:30px;}
    .form-label{display:block;font-size:.76rem;font-weight:600;color:#7A93B5;letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px;}
    .form-input{width:100%;padding:13px 15px;border-radius:10px;border:1.5px solid #2A3F5C;background:#162035;color:#E2EAF5;font-size:.95rem;outline:none;margin-bottom:14px;transition:border-color .2s;}
    .form-input:focus{border-color:var(--gold);}
    .btn-login{width:100%;padding:14px;border-radius:10px;background:var(--gold);color:#112549;font-size:.95rem;font-weight:700;border:none;margin-top:4px;transition:all .2s;}
    .btn-login:hover{background:var(--gold-lt);transform:translateY(-1px);}
    .login-error{color:#FCA5A5;font-size:.83rem;text-align:center;padding:10px;background:rgba(220,38,38,.15);border-radius:8px;margin-top:10px;display:none;}

    /* ══ APP HEADER ══ */
    #app{display:none;}
    .topbar{background:#0A1628;border-bottom:1px solid #1E2D45;display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:58px;position:fixed;top:0;left:0;right:0;z-index:100;}
    .topbar-left{display:flex;align-items:center;gap:14px;}
    .kitchen-badge{background:var(--gold);color:#112549;font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:100px;}
    .topbar-title{font-family:'Playfair Display SC',serif;font-size:1rem;color:#fff;}
    .topbar-right{display:flex;align-items:center;gap:14px;}
    .live-indicator{display:flex;align-items:center;gap:6px;font-size:.78rem;color:#7A93B5;}
    .live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.5s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
    .btn-ghost{padding:7px 13px;border-radius:8px;border:1px solid #2A3F5C;background:transparent;color:#7A93B5;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:6px;transition:all .2s;}
    .btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
    #clock{font-size:.88rem;color:#7A93B5;font-variant-numeric:tabular-nums;}

    /* ══ MAIN ══ */
    .main{padding:80px 20px 30px;max-width:1280px;margin:0 auto;}
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
    .stat-bar{display:flex;gap:14px;flex-wrap:wrap;}
    .stat-pill{background:#1C2A3F;border:1px solid #2A3F5C;border-radius:100px;padding:7px 16px;font-size:.8rem;color:#7A93B5;display:flex;align-items:center;gap:7px;}
    .stat-pill strong{color:#fff;}
    .section-label{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#3A5070;margin-bottom:12px;}

    /* ══ ORDER CARDS GRID ══ */
    .orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
    .order-card{background:#1C2A3F;border-radius:16px;border:2px solid #2A3F5C;overflow:hidden;display:flex;flex-direction:column;transition:border-color .3s;}
    .order-card.urgente{border-color:rgba(239,68,68,.5);}
    .order-card.advertencia{border-color:rgba(245,158,11,.4);}
    .order-card.normal{border-color:rgba(34,197,94,.3);}
    .order-card.lista{border-color:rgba(34,197,94,.5);opacity:.6;}

    /* Card header */
    .card-head{padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-bottom:1px solid #2A3F5C;}
    .card-mesa{font-family:'Playfair Display SC',serif;font-size:2rem;font-weight:700;line-height:1;color:#fff;}
    .card-area{font-size:.75rem;color:#7A93B5;margin-top:3px;}
    .card-mesero{display:flex;align-items:center;gap:5px;font-size:.76rem;color:var(--gold);margin-top:4px;font-weight:600;}
    .card-meta-right{text-align:right;flex-shrink:0;}
    .timer{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;}
    .timer.ok{color:var(--ok);}
    .timer.warn{color:var(--warn);}
    .timer.urgent{color:var(--urgent);}
    .timer-label{font-size:.68rem;color:#3A5070;margin-top:2px;}
    .status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:.7rem;font-weight:700;margin-top:6px;}
    .status-badge.abierta{background:rgba(245,158,11,.15);color:var(--warn);}
    .status-badge.lista{background:rgba(34,197,94,.15);color:var(--ok);}

    /* Card body: items */
    .card-body{flex:1;padding:12px 16px;}
    .item-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;margin-bottom:6px;background:#162035;border:1px solid #2A3F5C;transition:all .2s;}
    .item-row.item-ready{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.3);}
    .item-qty{font-size:1.1rem;font-weight:700;color:#fff;width:26px;text-align:center;flex-shrink:0;}
    .item-name{flex:1;font-size:.88rem;font-weight:600;color:#E2EAF5;}
    .item-name.done{text-decoration:line-through;color:#3A5070;}
    .item-cat{font-size:.7rem;color:#3A5070;display:block;margin-top:2px;}
    .item-note{font-size:.75rem;color:var(--gold);margin-top:3px;font-style:italic;}
    .check-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid #3A5070;background:transparent;color:#3A5070;font-size:.82rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
    .check-btn:hover{border-color:var(--ok);color:var(--ok);}
    .check-btn.checked{background:rgba(34,197,94,.15);border-color:var(--ok);color:var(--ok);}

    /* Card footer */
    .card-foot{padding:12px 16px;border-top:1px solid #2A3F5C;display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .order-total{font-size:1.1rem;font-weight:700;color:var(--gold-lt);font-variant-numeric:tabular-nums;}
    .order-total-label{font-size:.7rem;color:#3A5070;margin-bottom:2px;}
    .btn-ready{padding:9px 16px;border-radius:9px;background:rgba(34,197,94,.15);border:1.5px solid rgba(34,197,94,.4);color:var(--ok);font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:7px;transition:all .2s;}
    .btn-ready:hover{background:var(--ok);color:#fff;border-color:var(--ok);}
    .btn-ready.done-btn{background:rgba(34,197,94,.08);color:#3A5070;border-color:#2A3F5C;cursor:default;}

    /* ══ EMPTY STATE ══ */
    .empty-kitchen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;color:#3A5070;text-align:center;}
    .empty-kitchen i{font-size:4rem;margin-bottom:16px;opacity:.3;}
    .empty-kitchen h2{font-family:'Playfair Display SC',serif;font-size:1.3rem;color:#5A7090;margin-bottom:8px;}
    .empty-kitchen p{font-size:.875rem;}

    /* ══ TOAST ══ */
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);z-index:999;background:#fff;color:#1A1A2E;padding:12px 18px;border-radius:12px;font-size:.84rem;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 8px 32px rgba(0,0,0,.3);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
    .toast.success{background:var(--ok);color:#fff;}

    @media(max-width:640px){.orders-grid{grid-template-columns:1fr;}.main{padding:72px 14px 20px;}}
  </style>
</head>
<body>

<!-- Redirige a login si no hay sesión válida -->
<script>
(function(){
  const s = sessionStorage.getItem('restaurante_session');
  if(!s){ window.location.replace('login.html'); return; }
  try{ if(JSON.parse(s).role !== 'cocina') window.location.replace('login.html'); }
  catch(e){ window.location.replace('login.html'); }
})();
</script>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <span class="kitchen-badge"><i class="fa-solid fa-fire-burner"></i> &nbsp;Cocina</span>
      <span class="topbar-title" id="tb-name">Restaurante</span>
    </div>
    <div class="topbar-right">
      <div class="live-indicator"><div class="live-dot"></div> EN VIVO</div>
      <span id="clock"></span>
      <button class="btn-ghost" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
    </div>
  </div>

  <div class="main">
    <div class="page-header">
      <div class="stat-bar" id="stat-bar">
        <div class="stat-pill"><i class="fa-solid fa-receipt" style="color:var(--gold)"></i> Órdenes activas: <strong id="stat-active">0</strong></div>
        <div class="stat-pill"><i class="fa-solid fa-bowl-food" style="color:var(--warn)"></i> Platos pendientes: <strong id="stat-pending">0</strong></div>
        <div class="stat-pill"><i class="fa-solid fa-circle-check" style="color:var(--ok)"></i> Listos: <strong id="stat-ready">0</strong></div>
      </div>
    </div>
    <div class="section-label">Órdenes en curso — ordenadas por tiempo de espera</div>
    <div class="orders-grid" id="orders-grid"></div>
    <div class="empty-kitchen" id="empty-kitchen" style="display:none;">
      <i class="fa-solid fa-utensils"></i>
      <h2>Sin órdenes activas</h2>
      <p>Cuando un mesero tome una orden aparecerá aquí automáticamente.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i id="toast-icon" class="fa-solid fa-circle-check"></i><span id="toast-msg"></span></div>

<script>
// ── STATE ──────────────────────────────────────────────
let data = {};
let refreshInterval = null;

// ── DATA ───────────────────────────────────────────────
// ── FIREBASE ────────────────────────────────────────────
const firebaseConfig={apiKey:"AIzaSyBG8kFBatDKuuT0BufcqXTuSKpgcd0ps2Y",authDomain:"restauranteweb-35874.firebaseapp.com",databaseURL:"https://restauranteweb-35874-default-rtdb.firebaseio.com",projectId:"restauranteweb-35874",storageBucket:"restauranteweb-35874.firebasestorage.app",messagingSenderId:"403673864105",appId:"1:403673864105:web:3d79b786a9739739a9d6b8"};
firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database().ref('restaurante_data');

function fixArr(v){if(!v)return[];if(Array.isArray(v))return v;return Object.values(v).filter(x=>x!==null);}
function loadData(){/* sincronizado por Firebase */}
function saveData(){ dbRef.set(data); }

// Listener en tiempo real — reemplaza setInterval + storage event
dbRef.on('value', snap => {
  const fd = snap.val() || {};
  fd.orders = fixArr(fd.orders).map(o=>({...o,items:fixArr(o.items)}));
  fd.tables = fixArr(fd.tables);
  if(!fd.restaurant) fd.restaurant = {name:"Restaurante",address:""};
  data = fd;
  if(document.getElementById('app').style.display !== 'none') renderOrders();
});
function fmt(n){ return '$'+parseFloat(n||0).toFixed(2); }

// ── AUTH ───────────────────────────────────────────────
function doLogin(){
  loadData();
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const users = data.users || [];
  const found = users.find(x => x.username===u && x.password===p && x.role==='cocina');
  if(!found){ document.getElementById('login-error').style.display = 'block'; return; }
  sessionStorage.setItem('restaurante_session', JSON.stringify(found));
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initApp();
}
function doLogout(){
  clearInterval(refreshInterval);
  sessionStorage.removeItem('restaurante_session');
  window.location.href = 'login.html';
}

// Iniciar con sesión de login.html
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('app').style.display = 'block';
  initApp();
});

// ── INIT ───────────────────────────────────────────────
function initApp(){
  loadData();
  document.getElementById('tb-name').textContent = (data.restaurant||{}).name || 'Restaurante';
  renderOrders();
  updateClock();
  setInterval(updateClock, 1000); // reloj cada segundo (Firebase maneja el resto)
}

// ── CLOCK ──────────────────────────────────────────────
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  // Update all timers in place (lightweight)
  document.querySelectorAll('[data-opened]').forEach(el=>{
    const ms = Date.now() - parseInt(el.dataset.opened);
    const m  = Math.floor(ms/60000);
    const s  = Math.floor((ms%60000)/1000);
    el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    el.className = 'timer ' + (m<15?'ok':m<30?'warn':'urgent');
  });
}

// ── ORDERS ─────────────────────────────────────────────
function orderTotal(order){ return (order.items||[]).reduce((s,i)=>s+i.price*i.qty,0); }
function allReady(order){ return !!(order.items||[]).length && (order.items||[]).every(i=>i.ready); }

function urgencyClass(openedAt){
  const m = (Date.now()-new Date(openedAt).getTime())/60000;
  return m<15?'normal':m<30?'advertencia':'urgente';
}

function renderOrders(){
  loadData();
  const orders  = (data.orders||[]).filter(o=>o.items&&o.items.length);
  const tables  = data.tables||[];

  // Stats
  const pending = orders.reduce((a,o)=>(o.items||[]).filter(i=>!i.ready).length+a, 0);
  const ready   = orders.reduce((a,o)=>(o.items||[]).filter(i=>i.ready).length+a, 0);
  document.getElementById('stat-active').textContent  = orders.length;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-ready').textContent   = ready;

  const grid  = document.getElementById('orders-grid');
  const empty = document.getElementById('empty-kitchen');

  if(!orders.length){ grid.innerHTML=''; empty.style.display='flex'; return; }
  empty.style.display = 'none';

  // Sort oldest first (most urgent)
  const sorted = [...orders].sort((a,b)=>new Date(a.openedAt)-new Date(b.openedAt));

  grid.innerHTML = sorted.map(order=>{
    const t       = tables.find(x=>x.id===order.tableId);
    const mesero  = order.createdBy ? order.createdBy.name : '—';
    const total   = orderTotal(order);
    const lista   = allReady(order);
    const opened  = new Date(order.openedAt).getTime();
    const urg     = urgencyClass(order.openedAt);

    return `<div class="order-card ${lista?'lista':urg}" id="oc-${order.id}">
      <div class="card-head">
        <div>
          <div class="card-mesa">Mesa #${t?t.number:order.tableId}</div>
          <div class="card-area">${t?t.area:''}</div>
          <div class="card-mesero"><i class="fa-solid fa-user-tie"></i> ${mesero}</div>
        </div>
        <div class="card-meta-right">
          <div class="timer ${(Date.now()-opened)/60000<15?'ok':(Date.now()-opened)/60000<30?'warn':'urgent'}"
               data-opened="${opened}">0:00</div>
          <div class="timer-label">tiempo espera</div>
          <span class="status-badge ${lista?'lista':'abierta'}">
            <i class="fa-solid ${lista?'fa-circle-check':'fa-hourglass-half'}"></i>
            ${lista?'Lista':'En curso'}
          </span>
        </div>
      </div>

      <div class="card-body">
        ${(order.items||[]).map(item=>`
          <div class="item-row ${item.ready?'item-ready':''}" id="ir-${item.lineId}">
            <span class="item-qty">${item.qty}</span>
            <div style="flex:1;">
              <span class="item-name ${item.ready?'done':''}">${item.name}</span>
              <span class="item-cat">${item.cat}</span>
              ${item.note?`<div class="item-note"><i class="fa-solid fa-note-sticky" style="font-size:.65rem;"></i> ${item.note}</div>`:''}
            </div>
            <button class="check-btn ${item.ready?'checked':''}"
              onclick="toggleItem(${order.id},'${item.lineId}')"
              title="${item.ready?'Desmarcar':'Marcar listo'}">
              <i class="fa-solid ${item.ready?'fa-check':'fa-circle'}"></i>
            </button>
          </div>`).join('')}
      </div>

      <div class="card-foot">
        <div>
          <div class="order-total-label">Total de la mesa</div>
          <div class="order-total">${fmt(total)}</div>
        </div>
        ${lista
          ? `<button class="btn-ready done-btn"><i class="fa-solid fa-circle-check"></i> Orden Lista</button>`
          : `<button class="btn-ready" onclick="markAllReady(${order.id})">
               <i class="fa-solid fa-bell-concierge"></i> Marcar Todo Listo
             </button>`
        }
      </div>
    </div>`;
  }).join('');

  // Trigger first clock update immediately
  updateClock();
}

// ── ACTIONS ────────────────────────────────────────────
function toggleItem(orderId, lineId){
  loadData();
  const order = data.orders.find(o=>o.id===orderId);
  if(!order) return;
  const item = order.items.find(i=>i.lineId==lineId);
  if(!item) return;
  item.ready = !item.ready;
  saveData();
  renderOrders();
  toast(item.ready ? `✓ ${item.name} listo` : `${item.name} desmarcado`, 'success');
}

function markAllReady(orderId){
  loadData();
  const order = data.orders.find(o=>o.id===orderId);
  if(!order) return;
  order.items.forEach(i=>i.ready=true);
  saveData();
  renderOrders();
  const t = data.tables.find(x=>x.id===order.tableId);
  toast(`¡Mesa #${t?t.number:orderId} lista para servir!`,'success');
}

// ── TOAST ──────────────────────────────────────────────
let toastTimer;
function toast(msg,type='success'){
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'),3200);
}
</script>
</body>
</html>
